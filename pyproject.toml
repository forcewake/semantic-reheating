[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-reheating"
version = "0.1.0"
description = "A bounded, advisory reference kit for semantic recovery decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Semantic Reheating contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "jsonschema>=4.26,<5",
  "rfc8785>=0.1.4,<0.2",
]

[project.scripts]
reheat = "semantic_reheating.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "hypothesis>=6.165,<7",
  "pytest-cov>=7.1,<8",
  "Pillow>=12.3,<13",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
  "skills-ref>=0.1.1,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_reheating"]

[tool.pytest.ini_options]
addopts = "-m 'not pressure_live'"
markers = [
  "pressure_live: marks tests that require an explicitly selected live pressure environment",
]
